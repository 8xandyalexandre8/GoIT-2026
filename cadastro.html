<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Helpeople</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><main class="auth-layout"><section class="brand-panel"><a class="brand brand-large" href="index.html"><span class="brand-mark">♥</span>Helpeople</a><p>Uma comunidade que aprende<br>e cresce junto.</p></section><section class="auth-card"><a class="brand brand-mobile" href="index.html"><span class="brand-mark">♥</span>Helpeople</a><p class="eyebrow">JUNTE-SE A NÓS</p><h1>Crie sua conta</h1><form id="register-form"><label for="name">Nome completo *</label><input id="name" name="name" required autocomplete="name" placeholder="Seu nome completo"><label for="email">E-mail *</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="voce@escola.com"><label for="password">Senha *</label><input id="password" name="password" type="password" minlength="4" required autocomplete="new-password" placeholder="Mínimo de 4 caracteres"><label for="phone">Telefone <small>(opcional)</small></label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"><label for="institution">Instituição em que atua <small>(opcional)</small></label><input id="institution" name="institution" placeholder="Nome da escola ou instituição"><button class="button primary full" type="submit">Cadastrar</button></form><p class="switch-auth">Já tem uma conta? <a href="login.html">Fazer login</a></p><p class="tiny-note">Não use senhas reais neste protótipo.</p></section></main><script src="js/auth.js"></script></body></html>
