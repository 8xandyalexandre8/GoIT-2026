<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro | Helpeople</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/autenticacao.css"></head>
<body class="auth-page"><main class="auth-layout compact">
  <section class="brand-panel"><a class="brand brand-large" href="index.html"><span class="brand-mark">♥</span><span>Helpeople</span></a><p>Uma comunidade que aprende<br>e cresce junto.</p><div class="brand-art" aria-hidden="true"><span>✦</span><span>♡</span><span>✧</span></div></section>
  <section class="auth-card"><a class="brand brand-mobile" href="index.html"><span class="brand-mark">♥</span><span>Helpeople</span></a>
  <p class="eyebrow">JUNTE-SE A NÓS</p><h1>Crie sua conta</h1><p class="muted">Preencha os dados para continuar.</p>
  <form id="register-form">
    <label for="full-name">Nome completo <span>*</span></label><input id="full-name" name="name" autocomplete="name" required placeholder="Seu nome completo">
    <label for="register-email">E-mail <span>*</span></label><input id="register-email" name="email" type="email" autocomplete="email" required placeholder="voce@escola.com">
    <label for="register-password">Senha <span>*</span></label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="4" required placeholder="Mínimo de 4 caracteres">
    <label for="phone">Telefone <small>(opcional)</small></label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000">
    <button class="button primary full" type="submit">Cadastrar</button>
  </form><p class="switch-auth">Já tem uma conta? <a href="login.html">Fazer login</a></p>
  <p class="tiny-note">Protótipo: cadastro simulado somente neste navegador.</p></section>
</main><script src="js/app.js"></script><script src="js/autenticacao.js"></script></body></html>
