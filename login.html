<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Helpeople</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/autenticacao.css"></head>
<body class="auth-page"><main class="auth-layout compact">
  <section class="brand-panel"><a class="brand brand-large" href="index.html"><span class="brand-mark">♥</span><span>Helpeople</span></a><p>Boas ideias para uma<br>educação mais inclusiva.</p><div class="brand-art" aria-hidden="true"><span>✦</span><span>♡</span><span>✧</span></div></section>
  <section class="auth-card"><a class="brand brand-mobile" href="index.html"><span class="brand-mark">♥</span><span>Helpeople</span></a>
  <p class="eyebrow">QUE BOM TER VOCÊ AQUI</p><h1>Faça login</h1><p class="muted">Acesse seu espaço de aprendizagem.</p>
  <form id="login-form">
    <label for="login-email">E-mail <span>*</span></label><input id="login-email" name="email" type="email" autocomplete="email" required placeholder="voce@escola.com">
    <label for="login-password">Senha <span>*</span></label><input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
    <button class="button primary full" type="submit">Entrar</button>
  </form><p class="switch-auth">Ainda não tem cadastro? <a href="cadastro.html">Criar conta</a></p>
  <button class="text-button full" type="button" data-go="inicio.html">Continuar sem login</button>
  <p class="tiny-note">Protótipo demonstrativo; não use senhas reais.</p></section>
</main><script src="js/app.js"></script><script src="js/autenticacao.js"></script></body></html>
